<!DOCTYPE HTML>
<html lang="en-US">
<head>
	<meta charset="UTF-8">
	<title></title>
	<style type="text/css">
		* {margin:0; padding:0;}
		ul, li {list-style:none;}
		body {background-color:#333;}
		img {border:0;}
		#wrap {margin:100px auto; width:640px;}
		#nav li {float:left;}
		#nav img { width:70px;}
		#nav a{display:block; border:2px solid #bbb;margin:0 6px 10px 0; -webkit-border-radius:5px;}
		#nav a.active {border:2px solid #fff;}
		#window {clear:both; }
	</style>
	<script type="text/javascript" src="http://code.jquery.com/jquery-1.8.3.min.js"></script>
  <link rel="stylesheet" href="css/modern.css">
  <link rel="stylesheet" href="css/modern-subpage.css?v=8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
	<div id="wrap">
		<ul id="nav">
			<li><a href="imgs/g1_main.png" class="active"><img src="imgs/g1_main_s.png" alt="" /></a></li>
			<li><a href="imgs/lop1.jpg"><img src="imgs/thumb1.jpg" alt="" /></a></li>
			<li><a href="imgs/lop2.jpg"><img src="imgs/thumb2.jpg" alt="" /></a></li>
			<li><a href="imgs/lop3.jpg"><img src="imgs/thumb3.jpg" alt="" /></a></li>
			<li><a href="imgs/lop4.jpg"><img src="imgs/thumb4.jpg" alt="" /></a></li>
			<li><a href="imgs/lop5.jpg"><img src="imgs/thumb5.jpg" alt="" /></a></li>
			<li><a href="imgs/lop6.jpg"><img src="imgs/thumb6.jpg" alt="" /></a></li>
			<li><a href="imgs/lop7.jpg"><img src="imgs/thumb7.jpg" alt="" /></a></li>
		</ul>
		<div id="window"><img src="imgs/lop0.jpg" alt="" /></div>
	</div>
	<script type="text/javascript">
		$(document).ready(function(){
			$('#nav a').mouseover(function(e){
				e.preventDefault();
				$('#nav a').removeClass('active');
				$(this).addClass('active');
				img_url = $(this).attr('href');
				$('#window img').attr('src',img_url);
				});
			})
	</script>

<style>
  .footer-lang-quick { display: flex; align-items: center; font-size: 0.95rem; font-weight: bold; color: #888; }
  .footer-lang-quick a { color: #888; padding: 0 5px; text-decoration: none; transition: color 0.3s; }
  .footer-lang-quick a.active { color: #fff; }
  .footer-lang-quick a:hover { color: #fff; }
  .footer-right-group { display: flex; align-items: center; gap: 2rem; flex-wrap: wrap; margin-top: 10px; }
</style>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    var footerSocial = document.querySelector('.footer-social');
    var originalLang = document.querySelector('.nav-links .lang-switch');
    if(footerSocial && originalLang && !document.querySelector('.footer-lang-quick')) {
      var group = document.createElement('div');
      group.className = 'footer-right-group';
      footerSocial.parentNode.insertBefore(group, footerSocial);
      
      var quickLang = document.createElement('div');
      quickLang.className = 'footer-lang-quick';
      quickLang.innerHTML = originalLang.innerHTML;
      
      group.appendChild(footerSocial);
      group.appendChild(quickLang);
    }
  });
</script>
</body>
</html>
