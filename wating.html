<!Doctype html >
<html>
<head>
<meta charset="UTF8">

<style>

img{
        position: absolute;
        width: 500px;
     text-align: center;
      left: 50%; transform: translateX(-50%);
      
}
#wrapper{
     
        padding:0;
        margin: 0 auto;
        padding: 300px;
        max-width: 100%;
        height: 500px;
        
     background-image: url(wating_bg.jpg);
    
       
      
      
}



</style>
  <link rel="stylesheet" href="css/modern.css">
  <link rel="stylesheet" href="css/modern-subpage.css?v=9">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div id="wrapper">

<img src="wating.png"> <br>



</div>


<style>
  .footer-lang-quick { display: flex; align-items: center; font-size: 0.95rem; font-weight: bold; color: #888; }
  .footer-lang-quick a { color: #888; padding: 0 5px; text-decoration: none; transition: color 0.3s; }
  .footer-lang-quick a.active { color: #fff; }
  .footer-lang-quick a:hover { color: #fff; }
  .footer-right-group { display: flex; align-items: center; gap: 2rem; flex-wrap: wrap; margin-top: 10px; }
</style>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    var footerSocial = document.querySelector('.footer-social');
    if(footerSocial && !document.querySelector('.footer-lang-quick')) {
      var group = document.createElement('div');
      group.className = 'footer-right-group';
      footerSocial.parentNode.insertBefore(group, footerSocial);
      
      var quickLang = document.createElement('div');
      quickLang.className = 'footer-lang-quick';
      
      var path = window.location.pathname;
      var file = path.substring(path.lastIndexOf('/') + 1);
      if(!file) file = "index.html";
      
      var isEng = file.indexOf('_ko.html') === -1;
      var engFile = isEng ? file : file.replace('_ko.html', '.html');
      var korFile = isEng ? file.replace('.html', '_ko.html') : file;
      
      var engClass = isEng ? 'class="active"' : '';
      var korClass = isEng ? '' : 'class="active"';
      
      quickLang.innerHTML = '<a href="' + korFile + '" ' + korClass + '>KOR</a> | <a href="' + engFile + '" ' + engClass + '>ENG</a>';
      
      group.appendChild(footerSocial);
      group.appendChild(quickLang);
    }
  });
</script>
</body>
</html>
