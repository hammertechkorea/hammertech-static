<!Doctype html>
<html>
<head>
<meta charset="UTF8">
<title>해머텍 코리아 (HAMMERTECH KOREA)</title>
<script type="text/javascript" src="jquery-3.1.1.min.js"></script>
<script>
$(document).ready(function(){
    $(".topmenu").click(function(){
        $(".submenu").slideDown(500)
    });
    $(".submenu").mouseout(function(){
        $(".submenu").slideUp(1000)});
   
    });

</script>

<style>
.topmenu{ background:lightcoral; 

width: 300px;
height:20px;
cursor:pointer;
}
.test1{
    float:left;
    margin-right: 50px;
}
.submenu{
    background:lightpink;
    width: 300px;
    height: 60px;
    display: none;
    cursor: pointer;
}
.list1{
    float:left;
}

</style>
  <link rel="stylesheet" href="css/modern.css">
  <link rel="stylesheet" href="css/modern-subpage.css?v=8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav>
        <div class="topmenu">
        <div class="test1">menu1</div>
        <div class="test1">menu2</div>
        <div class="test1">menu3</div>
        </div>

        <div class="submenu">
                <div class="list1">
                <div class="test2">submenu1</div>
                <div class="test2">submenu1</div>
                <div class="test2">submenu1</div>
                </div>
                <div class="list1">
                <div class="test2">submenu1</div>
                <div class="test2">submenu1</div>
                <div class="test2">submenu1</div>
                </div>
        </div>

        </nav>

<style>
  .footer-lang-quick { display: flex; align-items: center; font-size: 0.95rem; font-weight: bold; color: #888; }
  .footer-lang-quick a { color: #888; padding: 0 5px; text-decoration: none; transition: color 0.3s; }
  .footer-lang-quick a.active { color: #fff; }
  .footer-lang-quick a:hover { color: #fff; }
  .footer-right-group { display: flex; align-items: center; gap: 2rem; flex-wrap: wrap; margin-top: 10px; }
</style>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    var footerSocial = document.querySelector('.footer-social');
    var originalLang = document.querySelector('.nav-links .lang-switch');
    if(footerSocial && originalLang && !document.querySelector('.footer-lang-quick')) {
      var group = document.createElement('div');
      group.className = 'footer-right-group';
      footerSocial.parentNode.insertBefore(group, footerSocial);
      
      var quickLang = document.createElement('div');
      quickLang.className = 'footer-lang-quick';
      quickLang.innerHTML = originalLang.innerHTML;
      
      group.appendChild(footerSocial);
      group.appendChild(quickLang);
    }
  });
</script>
</body>
