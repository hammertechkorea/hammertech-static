  <script>
    const navLinks = document.querySelector('.nav-links');
    document.querySelector('.hamburger').addEventListener('click', function() {
      navLinks.classList.add('active');
      document.body.style.overflow = 'hidden';
    });
    document.querySelector('.mobile-close').addEventListener('click', function() {
      navLinks.classList.remove('active');
      document.body.style.overflow = '';
    });

    const accordionLinks = document.querySelectorAll('.nav-links > li > a');
    accordionLinks.forEach(link => {
      link.addEventListener('click', function(e) {
        if (window.innerWidth <= 768 && this.nextElementSibling && this.nextElementSibling.classList.contains('dropdown-menu')) {
          e.preventDefault();
          this.parentElement.classList.toggle('expanded');
        }
      });
    });
    window.addEventListener('scroll', function() {
      const nav = document.querySelector('.modern-nav');
      if (window.scrollY > 50) {
        nav.style.background = 'rgba(10, 10, 12, 0.8)';
        nav.style.backdropFilter = 'blur(15px)';
      } else {
        nav.style.background = 'rgba(15, 15, 20, 0.6)';
        nav.style.backdropFilter = 'blur(12px)';
      }
    });
  </script>

<script>
  // Add universal floating back button
  document.addEventListener('DOMContentLoaded', function() {
    if (!document.querySelector('.floating-back-btn')) {
      var btn = document.createElement('button');
      var isEng = window.location.href.indexOf('_ko') === -1;
      btn.innerHTML = '<i class="fas fa-arrow-left"></i> ' + (isEng ? 'Go Back' : '목록으로');
      btn.className = 'floating-back-btn';
      btn.onclick = function() { 
        // Try to go back in history. If history is empty, maybe fallback to home, but history.back() is standard.
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = isEng ? 'index.html' : 'index_ko.html';
        }
      };
      document.body.appendChild(btn);
    }
  });
</script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    var nav = document.querySelector('.modern-nav');
    var hamburger = document.querySelector('.hamburger');
    var originalLang = document.querySelector('.nav-links .lang-switch');
    if(nav && hamburger && originalLang && !document.querySelector('.mobile-lang-quick')) {
      var group = document.createElement('div');
      group.className = 'nav-right-group';
      var quickLang = document.createElement('div');
      quickLang.className = 'mobile-lang-quick';
      quickLang.innerHTML = originalLang.innerHTML;
      nav.insertBefore(group, hamburger);
      group.appendChild(quickLang);
      group.appendChild(hamburger);
    }
  });
</script>
